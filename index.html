<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Wall Preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;1,300&display=swap">
<style>
/* Layout: a camera-style viewfinder. The wall fills the screen, the print hangs on it at real size, and a quiet control sheet sits below. Single dark look by choice. */
:root{
  --bg:#0E0E0E; --sheet:#151514; --ink:#F2F1EE; --soft:#9C9B97; --hair:#2B2B2A; --paper:#FCFCFA;
  --font:"Jost","Futura","Century Gothic","Avenir Next",Arial,sans-serif;
  --gut-l:max(18px, env(safe-area-inset-left, 0px)); --gut-r:max(18px, env(safe-area-inset-right, 0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:300;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
.label{font-size:11px;font-weight:400;letter-spacing:.22em;text-transform:uppercase}
.soft{color:var(--soft)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}

.app{height:100%;display:flex;flex-direction:column;max-width:920px;margin-inline:auto}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-block:14px 12px;padding-left:var(--gut-l);padding-right:var(--gut-r)}
.brand{font-size:13px;font-weight:400;letter-spacing:.4em}

.stage{position:relative;flex:1 1 auto;min-height:180px;overflow:hidden;background:#D9D5CE;touch-action:none;user-select:none;-webkit-user-select:none}
.wall{position:absolute;inset:0;background:
  linear-gradient(180deg,transparent 0 84%,#EFEDE8 84% 86.5%,#A8906F 86.5%),
  radial-gradient(120% 90% at 30% 20%,#E6E2DB 0,#D3CEC6 70%,#C6C0B7 100%)}
.stage video,.stage .wallimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.piece{position:absolute;transform:translate(-50%,-50%);cursor:grab;touch-action:none;display:flex}
.piece:active{cursor:grabbing}
.mat{flex:1;background:var(--paper);display:flex;min-width:0;min-height:0}
.art{flex:1;min-width:0;min-height:0;background:#BDBBB6;display:grid;place-items:center;overflow:hidden;position:relative}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.art span{color:#5C5B57;text-align:center;padding:4px;font-size:10px}
.status{position:absolute;left:0;right:0;bottom:10px;text-align:center;pointer-events:none}
.status span{background:rgba(14,14,14,.62);padding:5px 12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.cal{position:absolute;inset:0;pointer-events:none}
.cal svg{position:absolute;inset:0;width:100%;height:100%}
.handle{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;pointer-events:auto;touch-action:none;cursor:grab;display:grid;place-items:center}
.handle::after{content:"";width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #0E0E0E,0 1px 6px rgba(0,0,0,.5)}

.sheet{background:var(--sheet);border-top:1px solid var(--hair);padding-block:14px max(14px, env(safe-area-inset-bottom, 0px));padding-left:var(--gut-l);padding-right:var(--gut-r);display:grid;gap:14px}
.row{display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap}
.row > .label{flex:0 0 58px}
.opts{display:flex;gap:6px 16px;flex-wrap:wrap;align-items:center;min-width:0}
.chip{background:none;border:0;border-bottom:1px solid transparent;padding:4px 0;cursor:pointer;color:var(--soft)}
.chip[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.sw{width:30px;height:30px;border-radius:50%;border:1px solid var(--hair);padding:0;cursor:pointer;position:relative}
.sw[aria-pressed="true"]{outline:1px solid var(--ink);outline-offset:3px}
.sw.none{background:linear-gradient(135deg,transparent 47%,var(--soft) 47% 53%,transparent 53%),var(--sheet)}
.sw.black{background:#151515}.sw.white{background:#F4F3EF}
.sw.oak{background:linear-gradient(100deg,#C8A678,#B8935F 40%,#D2B48A 70%,#B58E5C)}
.sw.walnut{background:linear-gradient(100deg,#5E4030,#4A3024 45%,#6A4A38 75%,#4E3428)}
.acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.act{background:none;border:1px solid var(--hair);padding:6px 4px;min-height:50px;cursor:pointer;text-align:center;display:flex;align-items:center;justify-content:center}
.act.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.act[aria-pressed="true"]{border-color:var(--ink)}
.calbox{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:flex-end;border-top:1px solid var(--hair);padding-top:14px}
.calbox p{flex:1 1 100%;margin:0;color:var(--soft)}
.calbox input{width:92px;background:transparent;border:0;border-bottom:1px solid var(--ink);padding:6px 0;border-radius:0}
.msg{margin:0;color:var(--soft)}
#xr-ui{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;background:transparent}
#xr-ui > *{pointer-events:auto}
.xr-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:max(14px, env(safe-area-inset-top, 0px)) 16px 0}
.xr-top .act{background:rgba(14,14,14,.7);min-height:40px;padding:6px 16px}
.xr-hint{background:rgba(14,14,14,.7);padding:8px 12px;max-width:70%}
.xr-sheet{background:rgba(21,21,20,.82)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<div class="app">
  <header>
    <span class="brand">WALL PREVIEW</span>
    <span class="label soft">Test</span>
  </header>

  <div class="stage" id="stage">
    <div class="wall" id="wall"></div>
    <img class="wallimg" id="wallimg" alt="Your wall" hidden>
    <video id="cam" playsinline muted hidden></video>
    <div class="piece" id="piece" role="img" aria-label="The print on the wall. Drag to move, pinch to resize.">
      <div class="mat" id="mat"><div class="art" id="art"><span class="label" id="art-ph">Your photograph</span></div></div>
    </div>
    <div class="cal" id="cal" hidden>
      <svg aria-hidden="true"><line id="cal-line" stroke="#fff" stroke-width="2" stroke-dasharray="6 5"/></svg>
      <div class="handle" id="h1" role="slider" aria-label="First scale mark" tabindex="0"></div>
      <div class="handle" id="h2" role="slider" aria-label="Second scale mark" tabindex="0"></div>
    </div>
    <div class="status label"><span id="status"></span></div>
  </div>

  <div class="sheet">
    <div class="row"><span class="label soft">Size</span>
      <div class="opts" id="sizes"></div>
    </div>
    <div class="row"><span class="label soft">Frame</span>
      <div class="opts" id="frames"></div>
      <div class="opts"><button class="chip" type="button" id="mat-toggle" aria-pressed="true">Mat</button></div>
    </div>
    <div class="calbox" id="calbox" hidden>
      <p>Put the two marks on the ends of something whose size you know. An A4 sheet held against the wall is 29.7 cm long.</p>
      <label class="label soft" for="cal-len">Length, cm</label>
      <input id="cal-len" type="number" inputmode="decimal" min="1" step="0.1" value="29.7">
      <button class="chip" type="button" id="cal-apply" aria-pressed="true">Apply</button>
    </div>
    <p class="msg" id="msg" hidden></p>
    <div class="acts">
      <button class="act label" type="button" id="b-cam">Camera</button>
      <label class="act label" for="f-wall" tabindex="0">Photo</label>
      <label class="act label" for="f-art" tabindex="0">Artwork</label>
      <button class="act label" type="button" id="b-cal" aria-pressed="false">Scale</button>
    </div>
    <button class="act label primary" type="button" id="b-ar">Start AR on the wall</button>
    <button class="act label" type="button" id="b-save">Save image</button>
    <input class="vh" type="file" id="f-wall" accept="image/*">
    <input class="vh" type="file" id="f-art" accept="image/*">
  </div>
</div>

<div id="xr-ui" hidden>
  <div class="xr-top"><span class="xr-hint" id="xr-hint"></span><button class="act label" type="button" id="xr-exit">Close</button></div>
  <div class="sheet xr-sheet" id="xr-sheet">
    <div class="row"><span class="label soft">Size</span><div class="opts" id="xr-sizes"></div></div>
    <div class="row"><span class="label soft">Frame</span><div class="opts" id="xr-frames"></div>
      <div class="opts"><button class="chip" type="button" id="xr-mat" aria-pressed="true">Mat</button></div></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const SIZES=[{id:'s',w:45,h:30},{id:'m',w:60,h:40},{id:'l',w:90,h:60}];
const FRAMES=[{id:'none',name:'No frame'},{id:'black',name:'Black',c:['#151515']},{id:'white',name:'White',c:['#F4F3EF']},
  {id:'oak',name:'Oak',c:['#C8A678','#B8935F','#D2B48A','#B58E5C']},{id:'walnut',name:'Walnut',c:['#5E4030','#4A3024','#6A4A38','#4E3428']}];
const FRAME_CM=2, MAT_CM=6;
const S={size:'m',portrait:false,frame:'black',mat:true,cx:.5,cy:.4,kRel:1/260,exact:false,cal:false,a:{x:.3,y:.68},b:{x:.55,y:.68}};
const stage=$('stage'), piece=$('piece'), mat=$('mat'), art=$('art');
let artImg=null, stream=null;

$('sizes').innerHTML=SIZES.map(s=>`<button class="chip" type="button" data-size="${s.id}">${s.h} × ${s.w}</button>`).join('')+
  `<button class="chip" type="button" id="rot" aria-pressed="false">Portrait</button>`;
$('frames').innerHTML=FRAMES.map(f=>`<button class="sw ${f.id}" type="button" data-frame="${f.id}" aria-label="${f.name}" title="${f.name}"></button>`).join('');

function dims(){
  const s=SIZES.find(x=>x.id===S.size), w=S.portrait?s.h:s.w, h=S.portrait?s.w:s.h;
  const f=S.frame==='none'?0:FRAME_CM, m=S.mat?MAT_CM:0;
  return {w,h,f,m,W:w+2*(f+m),H:h+2*(f+m)};
}
function cssFrame(){const f=FRAMES.find(x=>x.id===S.frame);return !f.c?'transparent':f.c.length===1?f.c[0]:`linear-gradient(100deg,${f.c[0]},${f.c[1]} 40%,${f.c[2]} 70%,${f.c[3]})`}
function render(){
  const r=stage.getBoundingClientRect(), k=S.kRel*r.width, d=dims();
  piece.style.width=d.W*k+'px'; piece.style.height=d.H*k+'px';
  piece.style.left=S.cx*r.width+'px'; piece.style.top=S.cy*r.height+'px';
  piece.style.padding=d.f*k+'px'; piece.style.background=cssFrame();
  piece.style.boxShadow=`0 ${.5*k}px ${1.6*k}px rgba(0,0,0,.34)`;
  mat.style.padding=d.m*k+'px';
  if(S.frame==='white') piece.style.boxShadow+=`,0 0 0 1px rgba(0,0,0,.12)`;
  document.querySelectorAll('[data-size]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.size===S.size));
  document.querySelectorAll('[data-frame]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.frame===S.frame));
  $('rot').setAttribute('aria-pressed',S.portrait); $('mat-toggle').setAttribute('aria-pressed',S.mat);
  $('status').textContent=`${Math.min(d.w,d.h)} × ${Math.max(d.w,d.h)} cm · ${S.exact?'true to scale':'approximate scale'}`;
  $('cal').hidden=!S.cal; $('calbox').hidden=!S.cal; $('status').parentElement.hidden=S.cal; $('b-cal').setAttribute('aria-pressed',S.cal);
  if(S.cal){
    for(const [h,p] of [[$('h1'),S.a],[$('h2'),S.b]]){h.style.left=p.x*r.width+'px';h.style.top=p.y*r.height+'px'}
    const l=$('cal-line'); l.setAttribute('x1',S.a.x*r.width);l.setAttribute('y1',S.a.y*r.height);l.setAttribute('x2',S.b.x*r.width);l.setAttribute('y2',S.b.y*r.height);
  }
}
function say(t){const m=$('msg'); m.textContent=t||''; m.hidden=!t}

/* move and pinch */
const pts=new Map(); let pinch=0;
piece.addEventListener('pointerdown',e=>{piece.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});pinch=0});
piece.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)) return;
  const prev=pts.get(e.pointerId), r=stage.getBoundingClientRect();
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){
    S.cx=Math.min(1,Math.max(0,S.cx+(e.clientX-prev.x)/r.width)); S.cy=Math.min(1,Math.max(0,S.cy+(e.clientY-prev.y)/r.height));
  }else if(pts.size===2){
    const [p,q]=[...pts.values()], dist=Math.hypot(p.x-q.x,p.y-q.y);
    if(pinch){S.kRel=Math.min(.02,Math.max(.0008,S.kRel*dist/pinch)); S.exact=false}
    pinch=dist;
  }
  render();
});
const drop=e=>{pts.delete(e.pointerId);pinch=0};
piece.addEventListener('pointerup',drop); piece.addEventListener('pointercancel',drop);
stage.addEventListener('wheel',e=>{e.preventDefault();S.kRel=Math.min(.02,Math.max(.0008,S.kRel*(e.deltaY<0?1.04:.96)));S.exact=false;render()},{passive:false});

/* scale marks */
for(const [h,p] of [[$('h1'),S.a],[$('h2'),S.b]]){
  h.addEventListener('pointerdown',e=>{h.setPointerCapture(e.pointerId);h.dataset.on=1});
  h.addEventListener('pointermove',e=>{if(!h.dataset.on) return; const r=stage.getBoundingClientRect();
    p.x=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)); p.y=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height)); render()});
  const up=()=>{delete h.dataset.on}; h.addEventListener('pointerup',up); h.addEventListener('pointercancel',up);
}
$('b-cal').onclick=()=>{S.cal=!S.cal;say('');render()};
$('cal-apply').onclick=()=>{
  const len=parseFloat($('cal-len').value), r=stage.getBoundingClientRect();
  const px=Math.hypot((S.a.x-S.b.x)*r.width,(S.a.y-S.b.y)*r.height);
  if(!(len>0)||px<8){say('Move the two marks apart and enter a length in centimetres.');return}
  S.kRel=px/len/r.width; S.exact=true; S.cal=false; say(''); render();
};

/* options */
$('sizes').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.size) S.size=b.dataset.size; else S.portrait=!S.portrait; render()});
$('frames').addEventListener('click',e=>{const b=e.target.closest('[data-frame]'); if(b){S.frame=b.dataset.frame;render()}});
$('mat-toggle').onclick=()=>{S.mat=!S.mat;render()};
document.querySelectorAll('label.act').forEach(l=>l.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$(l.htmlFor).click()}}));

/* wall: live camera where the browser allows it, otherwise a photo */
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null} $('cam').hidden=true}
$('b-cam').onclick=async()=>{
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error('none');
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920}},audio:false});
    const v=$('cam'); v.srcObject=stream; await v.play();
    v.hidden=false; $('wallimg').hidden=true; S.exact=false; say(''); render();
  }catch(err){
    stopCam(); say('Live camera is not available in this view. Tap “Photo” to photograph the wall instead.');
  }
};
$('f-wall').onchange=e=>{const f=e.target.files[0]; if(!f) return; stopCam();
  const im=$('wallimg'); im.src=URL.createObjectURL(f); im.hidden=false; S.exact=false; say(''); render()};
$('f-art').onchange=e=>{const f=e.target.files[0]; if(!f) return;
  const im=new Image(); im.onload=()=>{artImg=im; art.querySelector('img')?.remove(); art.appendChild(im); $('art-ph').hidden=true;
    S.portrait=im.naturalHeight>im.naturalWidth; render()}; im.alt='Your photograph'; im.src=URL.createObjectURL(f)};

/* save the composed view */
function cover(ctx,src,sw,sh,x,y,w,h){const s=Math.max(w/sw,h/sh), cw=w/s, ch=h/s; ctx.drawImage(src,(sw-cw)/2,(sh-ch)/2,cw,ch,x,y,w,h)}
function compose(){
  const r=stage.getBoundingClientRect(), q=Math.min(3,Math.max(2,window.devicePixelRatio||1));
  const c=document.createElement('canvas'); c.width=Math.round(r.width*q); c.height=Math.round(r.height*q);
  const x=c.getContext('2d'), W=c.width, H=c.height, v=$('cam'), wi=$('wallimg');
  if(!v.hidden&&v.videoWidth) cover(x,v,v.videoWidth,v.videoHeight,0,0,W,H);
  else if(!wi.hidden&&wi.naturalWidth) cover(x,wi,wi.naturalWidth,wi.naturalHeight,0,0,W,H);
  else{const g=x.createRadialGradient(W*.3,H*.2,0,W*.3,H*.2,W*1.1);g.addColorStop(0,'#E6E2DB');g.addColorStop(.7,'#D3CEC6');g.addColorStop(1,'#C6C0B7');
    x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#EFEDE8';x.fillRect(0,H*.84,W,H*.025);x.fillStyle='#A8906F';x.fillRect(0,H*.865,W,H)}
  const k=S.kRel*W, d=dims(), pw=d.W*k, ph=d.H*k, px=S.cx*W-pw/2, py=S.cy*H-ph/2, f=FRAMES.find(z=>z.id===S.frame);
  x.save(); x.shadowColor='rgba(0,0,0,.34)'; x.shadowBlur=1.6*k; x.shadowOffsetY=.5*k;
  if(f.c){ if(f.c.length===1) x.fillStyle=f.c[0]; else{const g=x.createLinearGradient(px,py,px+pw,py+ph*.2);[0,.4,.7,1].forEach((t,i)=>g.addColorStop(t,f.c[i]));x.fillStyle=g} }
  else x.fillStyle='#FCFCFA';
  x.fillRect(px,py,pw,ph); x.restore();
  const ix=px+d.f*k, iy=py+d.f*k; x.fillStyle='#FCFCFA'; x.fillRect(ix,iy,pw-2*d.f*k,ph-2*d.f*k);
  const ax=ix+d.m*k, ay=iy+d.m*k, aw=d.w*k, ah=d.h*k;
  if(artImg) cover(x,artImg,artImg.naturalWidth,artImg.naturalHeight,ax,ay,aw,ah); else{x.fillStyle='#BDBBB6';x.fillRect(ax,ay,aw,ah)}
  return c;
}
const downloads=null;
$('b-save').onclick=()=>{
  let c; try{c=compose()}catch(e){say('The image could not be composed.');return}
  c.toBlob(async blob=>{
    if(!blob){say('The image could not be composed.');return}
    if(downloads){
      try{await downloads.save({filename:'wall-preview.png',data:blob}); say('Image saved.')}
      catch(err){say(err&&err.code==='declined'?'':'Saving is not available in this view.')}
    }else{
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='wall-preview.png'; a.click();
    }
  },'image/png');
};

window.__wall={S,dims,FRAMES,art:()=>artImg,render,say};
$('xr-sizes').innerHTML=SIZES.map(s=>`<button class="chip" type="button" data-size="${s.id}">${s.h} × ${s.w}</button>`).join('')+`<button class="chip" type="button" id="xr-rot" aria-pressed="false">Portrait</button>`;
$('xr-frames').innerHTML=FRAMES.map(f=>`<button class="sw ${f.id}" type="button" data-frame="${f.id}" aria-label="${f.name}"></button>`).join('');
$('xr-sheet').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.size) S.size=b.dataset.size; else if(b.dataset.frame) S.frame=b.dataset.frame; else if(b.id==='xr-rot') S.portrait=!S.portrait; else if(b.id==='xr-mat') S.mat=!S.mat;
  render(); $('xr-rot').setAttribute('aria-pressed',S.portrait); $('xr-mat').setAttribute('aria-pressed',S.mat); document.dispatchEvent(new Event('wall-change'))});
addEventListener('resize',render); render();
</script>

<script type="module">
import * as THREE from './three.module.min.js';
const W=window.__wall, btn=document.getElementById('b-ar'), ui=document.getElementById('xr-ui'), hint=document.getElementById('xr-hint');
let supported=false, renderer, scene, reticle, pic=null, session=null, hitSource=null, placed=false;
if(navigator.xr&&navigator.xr.isSessionSupported) navigator.xr.isSessionSupported('immersive-ar').then(v=>{supported=v}).catch(()=>{});

function artTexture(w,h){
  const c=document.createElement('canvas'); c.width=1536; c.height=Math.round(1536*h/w);
  const x=c.getContext('2d'), im=W.art();
  if(im){const s=Math.max(c.width/im.naturalWidth,c.height/im.naturalHeight), cw=c.width/s, ch=c.height/s;
    x.drawImage(im,(im.naturalWidth-cw)/2,(im.naturalHeight-ch)/2,cw,ch,0,0,c.width,c.height)}
  else{const g=x.createLinearGradient(0,0,0,c.height); g.addColorStop(0,'#C9D3D6'); g.addColorStop(.5,'#AEBFC4'); g.addColorStop(.51,'#3F5F66'); g.addColorStop(1,'#2C474D'); x.fillStyle=g; x.fillRect(0,0,c.width,c.height)}
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t;
}
function build(){
  const d=W.dims(), f=d.f/100, w=d.w/100, h=d.h/100, OW=d.W/100, OH=d.H/100, D=f?0.03:0.003, g=new THREE.Group();
  const fr=W.FRAMES.find(z=>z.id===W.S.frame);
  if(f){const box=new THREE.Mesh(new THREE.BoxGeometry(OW,D,OH),new THREE.MeshStandardMaterial({color:fr.c[fr.c.length>1?1:0],roughness:.6})); box.position.y=D/2; g.add(box)}
  const paper=new THREE.Mesh(new THREE.PlaneGeometry(OW-2*f,OH-2*f).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0xF2F1EC})); paper.position.y=D+.0006; g.add(paper);
  const a=new THREE.Mesh(new THREE.PlaneGeometry(w,h).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({map:artTexture(w,h)})); a.position.y=D+.0012; g.add(a);
  g.matrixAutoUpdate=false; return g;
}
function rebuild(){
  if(!scene) return; const old=pic; pic=build();
  if(old){pic.matrix.copy(old.matrix); scene.remove(old)}
  pic.visible=placed; scene.add(pic);
}
function place(){
  if(!reticle.visible||!pic) return;
  const m=reticle.matrix, pos=new THREE.Vector3().setFromMatrixPosition(m), n=new THREE.Vector3().setFromMatrixColumn(m,1).normalize();
  const cam=new THREE.Vector3().setFromMatrixPosition(renderer.xr.getCamera().matrixWorld);
  if(n.dot(cam.clone().sub(pos))<0) n.negate();
  const top=Math.abs(n.y)<0.7?new THREE.Vector3(0,1,0):pos.clone().sub(cam);
  top.sub(n.clone().multiplyScalar(top.dot(n))).normalize();
  const X=new THREE.Vector3().crossVectors(top,n).normalize(), Z=top.clone().negate();
  pic.matrix.makeBasis(X,n,Z).setPosition(pos); pic.visible=true; placed=true;
  hint.textContent='Tap again to move it. Sizes and frames change below.';
}
function init(){
  renderer=new THREE.WebGLRenderer({alpha:true,antialias:true}); renderer.setPixelRatio(window.devicePixelRatio); renderer.setSize(innerWidth,innerHeight);
  renderer.xr.enabled=true; renderer.domElement.style.cssText='position:fixed;inset:0;display:none';
  document.body.appendChild(renderer.domElement);
  scene=new THREE.Scene(); scene.add(new THREE.HemisphereLight(0xffffff,0x8a8a8a,2.4));
  reticle=new THREE.Mesh(new THREE.RingGeometry(.07,.085,40).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0xffffff}));
  reticle.matrixAutoUpdate=false; reticle.visible=false; scene.add(reticle);
}
const camera=new THREE.PerspectiveCamera(70,1,.01,30);
btn.addEventListener('click',async()=>{
  if(!supported){W.say('AR is not available in this browser. It needs Chrome on an Android phone with Google Play Services for AR. You can still use Camera or Photo below.');return}
  try{
    if(!renderer) init();
    ui.hidden=false;
    session=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['hit-test'],optionalFeatures:['dom-overlay'],domOverlay:{root:ui}});
    renderer.xr.setReferenceSpaceType('local');
    await renderer.xr.setSession(session);
    const viewer=await session.requestReferenceSpace('viewer');
    hitSource=await session.requestHitTestSource({space:viewer});
    placed=false; rebuild(); W.say('');
    hint.textContent='Move the phone slowly along the wall. When the ring appears, tap to hang the print.';
    session.addEventListener('select',place);
    session.addEventListener('end',()=>{ui.hidden=true; hitSource=null; session=null; placed=false; renderer.setAnimationLoop(null)});
    renderer.setAnimationLoop((t,frame)=>{
      if(frame&&hitSource){
        const hits=frame.getHitTestResults(hitSource), ref=renderer.xr.getReferenceSpace();
        const pose=hits.length?hits[0].getPose(ref):null;
        if(pose){reticle.visible=true; reticle.matrix.fromArray(pose.transform.matrix)} else reticle.visible=false;
      }
      renderer.render(scene,camera);
    });
  }catch(err){
    ui.hidden=true; W.say('AR could not start: '+(err&&err.message?err.message:'unknown error')+'. You can still use Camera or Photo below.');
  }
});
ui.addEventListener('beforexrselect',e=>e.preventDefault());
document.getElementById('xr-exit').addEventListener('click',()=>{if(session) session.end()});
document.addEventListener('wall-change',rebuild);
</script>
</body>
